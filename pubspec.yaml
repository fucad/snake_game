name: snake_game
description: "Ad-free, open-source arena snake game. Part of the fucad project."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.37.0
  flame_audio: ^2.12.1
  shared_preferences: ^2.5.5
  # Pure-math Vector2 for the logic layer (same type Flame re-exports).
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

  # Nunito (SIL OFL 1.1, assets/fonts/OFL.txt) is bundled so the app makes
  # zero network calls. Static weights were instanced from Google Fonts'
  # variable Nunito[wght].ttf with fonttools (see assets/fonts/README.md).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

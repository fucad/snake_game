name: Feature Request
description: Suggest a new feature or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read GAME_DESIGN.md before requesting features.
        Some decisions are final (no multiplayer, no ads, no analytics).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gameplay or usability problem.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.

  - type: checkboxes
    id: constraints
    attributes:
      label: Compatibility check
      options:
        - label: Does not require a server or internet connection
          required: true
        - label: Does not add ads, analytics, or monetization
          required: true
        - label: Works on both Android and iOS
          required: true
